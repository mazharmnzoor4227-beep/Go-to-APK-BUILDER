<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Code2APK Free</title>
  <style>
    :root{font-family:Inter,system-ui,Arial,sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;background:#0b0d10;color:#fff}
    .wrap{max-width:980px;margin:auto;padding:24px}
    .top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .logo{width:44px;height:44px;border-radius:12px;background:#fff;color:#111;display:grid;place-items:center;font-weight:900}
    h1{font-size:26px;margin:0}.sub{color:#9da4ae;margin-top:4px}
    .card{background:#13171c;border:1px solid #242a31;border-radius:18px;padding:18px;margin:14px 0}
    .tabs{display:flex;gap:8px;margin-bottom:14px}
    button,.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
    .primary{background:#fff;color:#111}.secondary{background:#222831;color:#fff}
    input,textarea{width:100%;background:#0d1116;border:1px solid #2a3139;color:#fff;border-radius:12px;padding:12px}
    textarea{min-height:180px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
    label{display:block;margin:10px 0 7px;color:#c6cbd2;font-size:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .hidden{display:none}
    .drop{border:1px dashed #39424c;border-radius:14px;padding:22px;text-align:center}
    .status{white-space:pre-wrap;background:#090c10;border-radius:12px;padding:14px;min-height:110px;color:#b8c0ca}
    .ok{color:#7ee787}.err{color:#ff7b72}.muted{color:#8b949e;font-size:13px}
    .big{width:100%;font-size:16px;padding:15px;margin-top:12px}
    .history{display:grid;gap:10px}
    .item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#0f1318;border-radius:12px;padding:12px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">A</div><div><h1>Code2APK Free</h1><div class="sub">HTML/CSS/JS → real Android APK using GitHub Actions</div></div></div>

  <div class="card">
    <b>One-time GitHub setup</b>
    <label>GitHub owner / username</label>
    <input id="owner" placeholder="your-github-username">
    <label>Repository name</label>
    <input id="repo" placeholder="code2apk-builder">
    <label>GitHub fine-grained token</label>
    <input id="token" type="password" placeholder="Token with Contents + Actions access">
    <div class="muted">Stored only in this browser. Do not share your token.</div>
    <button class="secondary" style="margin-top:10px" onclick="saveSettings()">Save setup</button>
  </div>

  <div class="card">
    <div class="tabs">
      <button id="tabPaste" class="primary" onclick="showMode('paste')">Paste Code</button>
      <button id="tabZip" class="secondary" onclick="showMode('zip')">Upload ZIP</button>
    </div>

    <div id="pasteMode">
      <label>Complete HTML (you can include CSS + JS inside it)</label>
      <textarea id="html" placeholder="Paste a complete HTML file here..."></textarea>
      <div class="grid">
        <div><label>Optional CSS</label><textarea id="css" style="min-height:110px"></textarea></div>
        <div><label>Optional JavaScript</label><textarea id="js" style="min-height:110px"></textarea></div>
      </div>
    </div>

    <div id="zipMode" class="hidden">
      <div class="drop">
        <label>Upload a ZIP containing index.html and assets</label>
        <input id="zipFile" type="file" accept=".zip">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="grid">
      <div><label>App name</label><input id="appName" placeholder="My App"></div>
      <div><label>Package ID</label><input id="appId" placeholder="com.example.myapp"></div>
    </div>
    <label>App icon (PNG/JPG, preferably square 1024×1024)</label>
    <input id="icon" type="file" accept="image/png,image/jpeg">
    <button class="primary big" onclick="buildApk()">GENERATE APK</button>
  </div>

  <div class="card">
    <b>Build status</b>
    <div id="status" class="status" style="margin-top:10px">Ready.</div>
    <div id="downloadArea" class="hidden" style="margin-top:12px">
      <button class="primary" onclick="downloadApk()">Download APK artifact</button>
    </div>
  </div>

  <div class="card">
    <b>Recent builds</b>
    <div id="history" class="history" style="margin-top:10px"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
let mode='paste', currentRun=null, currentArtifact=null;

function setStatus(t, cls=''){ const el=document.getElementById('status'); el.textContent=t; el.className='status '+cls; }
function showMode(m){ mode=m; document.getElementById('pasteMode').classList.toggle('hidden',m!=='paste'); document.getElementById('zipMode').classList.toggle('hidden',m!=='zip'); document.getElementById('tabPaste').className=m==='paste'?'primary':'secondary'; document.getElementById('tabZip').className=m==='zip'?'primary':'secondary'; }
function saveSettings(){
  const s={owner:owner.value.trim(),repo:repo.value.trim(),token:token.value.trim()};
  localStorage.setItem('code2apk_settings',JSON.stringify(s)); setStatus('GitHub setup saved in this browser.','ok');
}
function loadSettings(){ try{const s=JSON.parse(localStorage.getItem('code2apk_settings')||'{}'); owner.value=s.owner||'';repo.value=s.repo||'';token.value=s.token||'';}catch{} renderHistory(); }
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,40)||'myapp'}
function validAppId(s){return /^[a-zA-Z][\w]*(\.[a-zA-Z][\w]*)+$/.test(s)}
async function fileToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
async function gh(path, opts={}){
  const t=token.value.trim(); if(!t) throw new Error('GitHub token missing');
  const res=await fetch('https://api.github.com'+path,{...opts,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});
  if(!res.ok){let txt=await res.text();throw new Error('GitHub '+res.status+': '+txt.slice(0,300))}
  if(res.status===204)return null; return res.json();
}
async function createPayload(){
  const zip=new JSZip();
  if(mode==='zip'){
    const f=zipFile.files[0]; if(!f) throw new Error('Choose a ZIP file');
    const inzip=await JSZip.loadAsync(f);
    let found=false;
    for(const [name,obj] of Object.entries(inzip.files)){
      if(obj.dir) continue;
      if(name.includes('..')) continue;
      const data=await obj.async('uint8array');
      zip.file('www/'+name.replace(/^\/+/,''),data);
      if(/(^|\/)index\.html$/i.test(name)) found=true;
    }
    if(!found) throw new Error('No index.html found in uploaded ZIP');
  } else {
    let h=html.value.trim(); if(!h) throw new Error('Paste HTML code first');
    const c=css.value, j=js.value;
    if(!/<html[\s>]/i.test(h)){
      h='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">'+(c?'<style>'+c+'</style>':'')+'</head><body>'+h+(j?'<script>'+j+'<\/script>':'')+'</body></html>';
    } else {
      if(c) h=h.replace(/<\/head>/i,'<style>'+c+'</style></head>');
      if(j) h=h.replace(/<\/body>/i,'<script>'+j+'<\/script></body>');
    }
    zip.file('www/index.html',h);
  }
  const iconFile=icon.files[0];
  if(iconFile) zip.file('assets/icon.'+(iconFile.type.includes('jpeg')?'jpg':'png'), await iconFile.arrayBuffer());
  zip.file('meta.json',JSON.stringify({appName:appName.value.trim(),appId:appId.value.trim()},null,2));
  return zip.generateAsync({type:'base64',compression:'DEFLATE',compressionOptions:{level:6}});
}
async function putJob(buildId, b64){
  const path=`jobs/${buildId}.zip`;
  return gh(`/repos/${owner.value.trim()}/${repo.value.trim()}/contents/${encodeURIComponent(path).replace(/%2F/g,'/')}`,{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:`Code2APK build ${buildId}`,content:b64})
  });
}
async function dispatch(buildId){
  return gh(`/repos/${owner.value.trim()}/${repo.value.trim()}/actions/workflows/build-apk.yml/dispatches`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ref:'main',inputs:{build_id:buildId}})
  });
}
async function findRun(buildId){
  const data=await gh(`/repos/${owner.value.trim()}/${repo.value.trim()}/actions/workflows/build-apk.yml/runs?per_page=20`);
  return data.workflow_runs.find(r=>r.display_title===`Code2APK-${buildId}`)||null;
}
async function poll(buildId){
  setStatus('Build queued on GitHub Actions…');
  for(let i=0;i<90;i++){
    await new Promise(r=>setTimeout(r,5000));
    const run=await findRun(buildId);
    if(!run){setStatus('Waiting for GitHub runner…');continue}
    currentRun=run;
    if(run.status!=='completed'){setStatus(`Build status: ${run.status}\nGitHub Actions is creating the Android project and APK…`);continue}
    if(run.conclusion!=='success') throw new Error('Android build failed. Open the GitHub Actions run to see the build log.');
    const arts=await gh(`/repos/${owner.value.trim()}/${repo.value.trim()}/actions/runs/${run.id}/artifacts`);
    currentArtifact=arts.artifacts.find(a=>a.name.startsWith('apk-'))||arts.artifacts[0];
    if(!currentArtifact) throw new Error('Build succeeded but APK artifact was not found.');
    setStatus('BUILD SUCCESSFUL ✅\nYour real Android APK is ready.','ok');
    document.getElementById('downloadArea').classList.remove('hidden');
    addHistory({name:appName.value.trim(),buildId,runId:run.id,artifactId:currentArtifact.id,time:new Date().toISOString()});
    return;
  }
  throw new Error('Timed out waiting for build. Check GitHub Actions.');
}
async function buildApk(){
  try{
    document.getElementById('downloadArea').classList.add('hidden');
    const name=appName.value.trim(); if(!name) throw new Error('Enter app name');
    if(!appId.value.trim()) appId.value='com.code2apk.'+slug(name);
    if(!validAppId(appId.value.trim())) throw new Error('Invalid package ID, example: com.example.myapp');
    if(!owner.value.trim()||!repo.value.trim()||!token.value.trim()) throw new Error('Complete the one-time GitHub setup first');
    saveSettings();
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    setStatus('Preparing your web project…');
    const b64=await createPayload();
    if(b64.length>90*1024*1024) throw new Error('Project is too large for this free GitHub upload method');
    setStatus('Uploading build job to GitHub…');
    await putJob(id,b64);
    setStatus('Starting Android build…');
    await dispatch(id);
    await poll(id);
  }catch(e){setStatus('ERROR: '+e.message,'err')}
}
async function downloadApk(){
  try{
    if(!currentArtifact) throw new Error('No artifact selected');
    setStatus('Downloading APK artifact…');
    const res=await fetch(currentArtifact.archive_download_url,{headers:{'Authorization':'Bearer '+token.value.trim(),'Accept':'application/vnd.github+json'}});
    if(!res.ok) throw new Error('Artifact download failed: '+res.status);
    const blob=await res.blob();
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Code2APK-build.zip'; a.click(); URL.revokeObjectURL(a.href);
    setStatus('Downloaded. Open the ZIP; the .apk file is inside.','ok');
  }catch(e){setStatus('ERROR: '+e.message,'err')}
}
function addHistory(x){const arr=JSON.parse(localStorage.getItem('code2apk_history')||'[]');arr.unshift(x);localStorage.setItem('code2apk_history',JSON.stringify(arr.slice(0,10)));renderHistory()}
function renderHistory(){const arr=JSON.parse(localStorage.getItem('code2apk_history')||'[]');history.innerHTML=arr.length?arr.map(x=>`<div class="item"><div><b>${x.name}</b><div class="muted">${new Date(x.time).toLocaleString()}</div></div><div class="muted">${x.buildId}</div></div>`).join(''):'<div class="muted">No builds yet.</div>'}
loadSettings();
</script>
</body>
</html>
